name: Release Windows portable app

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$packageVersion"
          }

      - name: Run tests
        run: npm test

      - name: Prepare version for this main push
        if: github.ref == 'refs/heads/main'
        id: release_version
        shell: pwsh
        run: |
          $baseVersion = node -p "require('./package.json').version"
          if ($baseVersion -notmatch '^([0-9]+)\.([0-9]+)\.[0-9]+$') {
            throw "Expected a major.minor.patch package version, found $baseVersion"
          }
          $version = "$($Matches[1]).$($Matches[2]).$env:GITHUB_RUN_NUMBER"
          $tag = "v$version"
          if (git tag --list $tag) {
            throw "Release tag $tag already exists; refusing to overwrite a release."
          }
          npm version $version --no-git-tag-version --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw "Could not stamp release version $version." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build portable executable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:win

      - name: Name main build artifact
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = '${{ steps.release_version.outputs.version }}'
          Move-Item "release/PiECode-$version-win-x64.exe" "release/PiECode-v$version-win-x64.exe" -ErrorAction Stop

      - name: Publish versioned main release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          name: PiECode ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: false
          make_latest: legacy
          fail_on_unmatched_files: true
          overwrite_files: false
          files: release/PiECode-v${{ steps.release_version.outputs.version }}-win-x64.exe

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*.exe
