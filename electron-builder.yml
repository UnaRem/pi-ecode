appId: io.github.unarem.pi-ecode
productName: PiECode
artifactName: PiECode-${version}-win-x64.${ext}
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/ecode-icon.ico
    to: ecode-icon.ico
win:
  electronLanguages:
    - en-US
    - zh-CN
  executableName: PiECode
  icon: ecode-icon.ico
  target:
    - target: portable
      arch:
        - x64
